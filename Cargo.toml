[package]
name = "tbrowse"
version = "0.1.0"
edition = "2021"
description = "Terminal browser: Obscura (Rust + V8) renders the page, the terminal shows the pixels"

[dependencies]
tungstenite = "0.30"
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# icy_sixel = pure-Rust sixel encoder, so no libsixel needed (Windows Terminal, foot, WezTerm...)
viuer = { version = "0.11", features = ["icy_sixel"] }
crossterm = "0.29"
unicode-width = "0.2"  # wide (CJK/emoji) glyphs take 2 cells in text mode
ansi_colours = "1"     # 256-colour fallback when the terminal has no truecolor

[profile.release]
strip = true
lto = true
